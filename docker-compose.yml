services:
  neo4j:
    image: neo4j:5.20-community
    container_name: crimenet-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/crimenet2026
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgis/postgis:16-3.4
    container_name: crimenet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crimenet
      POSTGRES_USER: crimenet
      POSTGRES_PASSWORD: crimenet2026
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crimenet-redis
    ports:
      - "6379:6379"

volumes:
  neo4j_data:
  pg_data:
